<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211D18">
<title>radost — келнер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --ink:#211D18; --ink-soft:#4A423A; --bg:#F2EDE1; --card:#FBF9F4; --gray:#948C7D;
    --line:rgba(33,29,24,0.09); --gold:#EFAE26; --gold-dark:#C88A17; --gold-wash:#FBEBC8;
    --green:#3E8E5A; --red:#C24A3B;
    --shadow-sm:0 2px 8px rgba(76,58,20,0.06); --shadow-md:0 14px 34px rgba(43,32,10,0.14);
    --radius-lg:18px; --radius-md:12px;
    --font-display:'Nunito',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'Space Mono',monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  input{ font-family:inherit; }

  /* ---------- login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
    padding:32px 28px; width:100%; max-width:340px; text-align:center;
  }
  .login-card .logo{ font-family:var(--font-display); font-weight:900; font-size:28px; margin-bottom:2px; }
  .login-card .logo span{ background:var(--gold); padding:0 5px; border-radius:6px; }
  .login-card .sub{ font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gray); font-weight:700; margin-bottom:24px; }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ font-size:12px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:5px; }
  .field input{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 14px;
    font-size:15px; background:#fff;
  }
  .field input:focus{ outline:2px solid var(--gold-dark); }
  .login-btn{
    width:100%; background:var(--ink); color:var(--gold-wash); border:none; padding:14px;
    border-radius:999px; font-weight:800; font-size:14px; margin-top:8px;
  }
  .login-btn:disabled{ opacity:0.5; }
  .err{ color:var(--red); font-size:12.5px; margin-top:12px; min-height:16px; }
  .back-link{ display:inline-block; margin-top:18px; font-size:12px; color:var(--gray); text-decoration:none; }

  /* ---------- app shell ---------- */
  #appScreen{ display:none; }
  header.top{
    position:sticky; top:0; z-index:10; background:var(--ink); color:var(--gold-wash);
    padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header.top .hi{ font-family:var(--font-display); font-weight:900; font-size:18px; }
  header.top .hi small{ display:block; font-family:var(--font-body); font-weight:600; font-size:11px; opacity:0.6; text-transform:none; letter-spacing:0; }
  header.top button{
    background:rgba(255,255,255,0.1); color:var(--gold-wash); border:none; border-radius:999px;
    padding:8px 14px; font-size:12px; font-weight:700;
  }

  nav.tabs{ display:flex; gap:8px; padding:14px 18px 0; max-width:640px; margin:0 auto; }
  nav.tabs button{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px;
    font-size:12.5px; font-weight:800; color:var(--ink-soft);
  }
  nav.tabs button.active{ background:var(--gold); color:var(--ink); border-color:transparent; }

  main{ max-width:640px; margin:0 auto; padding:16px 18px 60px; }
  .empty{ text-align:center; color:var(--gray); font-size:13.5px; margin-top:60px; line-height:1.6; }
  .filter-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .btn-week{ background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; color:var(--ink-soft); }

  .order-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); padding:16px; margin-bottom:14px; animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .oc-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .oc-num{ font-family:var(--font-mono); font-weight:700; font-size:16px; }
  .badge{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    padding:4px 10px; border-radius:999px;
  }
  .badge.new{ background:var(--gold-wash); color:var(--gold-dark); }
  .badge.progress{ background:#E4EEE8; color:var(--green); }
  .oc-meta{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; display:flex; gap:10px; flex-wrap:wrap; }
  .oc-items{ font-size:13.5px; line-height:1.7; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:8px 0; margin-bottom:8px; }
  .oc-items .it{ display:flex; justify-content:space-between; }
  .oc-note{ font-size:12.5px; background:var(--gold-wash); color:var(--ink-soft); padding:8px 10px; border-radius:8px; margin-bottom:10px; }
  .oc-total{ display:flex; justify-content:space-between; font-weight:800; font-size:14.5px; margin-bottom:12px; }
  .oc-actions{ display:flex; gap:8px; }
  .oc-actions button{ flex:1; padding:11px; border-radius:999px; font-weight:800; font-size:13px; border:none; }
  .btn-claim{ background:var(--ink); color:var(--gold-wash); }
  .btn-complete{ background:var(--gold); color:var(--ink); }
  .btn-print{ background:transparent; border:1px solid var(--line) !important; color:var(--ink-soft); flex:0 0 44px; }

  /* ---------- settings bar ---------- */
  .settings-bar{
    max-width:640px; margin:0 auto; padding:10px 18px 0; display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .settings-btn{
    background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 13px;
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
  }
  .settings-btn.off{ opacity:0.55; }
  .settings-remind{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .settings-remind input{
    width:46px; border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-size:12px; text-align:center;
  }

  /* ---------- overdue highlight ---------- */
  .order-card.overdue{ border-color:var(--red); box-shadow:0 0 0 2px rgba(194,74,59,0.18); }
  .badge.overdue{ background:#F7DCD8; color:var(--red); }

  /* ---------- toast ---------- */
  #toastRoot{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background:var(--ink); color:var(--gold-wash); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:700;
    box-shadow:var(--shadow-md); animation:toastIn .2s ease, toastOut .3s ease 3.7s forwards; max-width:90vw; text-align:center;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastOut{ to{opacity:0; transform:translateY(-8px);} }

  /* ---------- bills tab ---------- */
  .bill-group{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:14px 16px; margin-bottom:12px; }
  .bill-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .bill-head .t{ font-weight:800; font-size:14px; }
  .bill-line{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .bill-line:last-of-type{ border-bottom:none; }
  .bill-total{ display:flex; justify-content:space-between; font-weight:800; font-size:13.5px; margin:8px 0; }
  .badge.paid{ background:#E4EEE8; color:var(--green); }
  .badge.unpaid{ background:#F7DCD8; color:var(--red); }
  .pay-btn{ width:100%; margin-top:6px; padding:10px; border-radius:999px; font-weight:800; font-size:12.5px; border:none; }
  .pay-btn.mark-paid{ background:var(--gold); color:var(--ink); }
  .pay-btn.mark-open{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); }

  .print-receipt{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    .print-receipt, .print-receipt *{ visibility:visible; }
    .print-receipt{ display:block; position:absolute; top:0; left:0; width:100%; padding:14px; font-family:var(--font-mono); color:#000; font-size:12px; }
    .print-receipt h3{ text-align:center; font-size:15px; margin:0 0 4px; }
    .print-receipt .r-line{ display:flex; justify-content:space-between; margin:2px 0; }
    .print-receipt hr{ border:none; border-top:1px dashed #000; margin:8px 0; }
    .print-receipt .slip{ page-break-after:always; padding-bottom:10px; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="logo">ra<span>do</span>st</div>
    <div class="sub">Персонал · Келнер</div>
    <div class="field">
      <label for="email">Е-пошта</label>
      <input id="email" type="email" autocomplete="username" placeholder="ime@radost.mk">
    </div>
    <div class="field">
      <label for="pass">Лозинка</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="login-btn" id="loginBtn">Најави се</button>
    <div class="err" id="loginErr"></div>
    <a class="back-link" href="index.html">← Назад кон менито</a>
  </div>
</div>

<div id="appScreen">
  <header class="top">
    <div class="hi" id="hiName">Здраво<small id="hiSub">—</small></div>
    <button id="logoutBtn">Одјави се</button>
  </header>
  <div class="settings-bar">
    <button id="soundToggle" class="settings-btn">🔔 Известувања: ВКЛ</button>
    <div class="settings-remind">
      <label for="reminderInput">Потсети по</label>
      <input type="number" id="reminderInput" min="1" max="10" value="3">
      <span>мин</span>
    </div>
  </div>
  <nav class="tabs">
    <button class="active" data-tab="queue">На ред</button>
    <button data-tab="done">Завршени денес</button>
    <button data-tab="bills">Сметки</button>
    <button data-tab="schedule">Распоред</button>
  </nav>
  <main id="mainRoot"></main>
</div>

<div class="print-receipt" id="printReceipt"></div>
<div id="toastRoot"></div>

<script>
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const emailInp = document.getElementById('email');
const passInp = document.getElementById('pass');

let myUid = null, myName = '', myRole = '';
let activeTab = 'queue';
let openMap = new Map();       // every order that's not completed yet, from any waiter
let doneList = [];             // completed today, by me
let billsOrders = [];          // completed orders (any waiter), used by the Сметки tab

/* ---------------- notifications ---------------- */
let soundOn = localStorage.getItem('radost_sound_on') !== 'off';
let reminderMinutes = Math.min(10, Math.max(1, parseInt(localStorage.getItem('radost_reminder_min')||'3',10)));
let audioCtx = null;
let firstOpenSnapshot = true;
let remindedAt = new Map(); // orderId -> ms timestamp of last reminder beep

function primeAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ /* ignore */ }
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function beep(freq, delay, dur){
  if(!soundOn || !audioCtx) return;
  setTimeout(()=>{
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur);
    }catch(e){ /* ignore */ }
  }, delay);
}
function playNewOrderSound(){ beep(880,0,0.35); beep(1174,160,0.35); }
function playReminderSound(){ beep(660,0,0.25); beep(660,220,0.25); beep(660,440,0.25); }

function showToast(msg){
  const root = document.getElementById('toastRoot');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(()=> t.remove(), 4100);
}

function notifyNewOrder(o){
  if(!soundOn) return;
  playNewOrderSound();
  showToast(`🔔 Нова нарачка #${o.orderNumber}${o.table ? ' · Маса '+o.table : ''}`);
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Нова нарачка #'+o.orderNumber, { body: o.type==='table' ? 'Маса '+(o.table||'—') : 'За понесување' }); }catch(e){}
  }
}

document.getElementById('soundToggle').addEventListener('click', ()=>{
  soundOn = !soundOn;
  localStorage.setItem('radost_sound_on', soundOn ? 'on' : 'off');
  updateSoundToggleUI();
});
function updateSoundToggleUI(){
  const btn = document.getElementById('soundToggle');
  btn.textContent = soundOn ? '🔔 Известувања: ВКЛ' : '🔕 Известувања: ИСКЛ';
  btn.classList.toggle('off', !soundOn);
}
updateSoundToggleUI();

const reminderInput = document.getElementById('reminderInput');
reminderInput.value = reminderMinutes;
reminderInput.addEventListener('change', ()=>{
  let v = parseInt(reminderInput.value,10);
  if(isNaN(v)) v = 3;
  v = Math.min(10, Math.max(1, v));
  reminderInput.value = v;
  reminderMinutes = v;
  localStorage.setItem('radost_reminder_min', v);
  remindedAt.clear();
});

function checkOverdueOrders(){
  const now = Date.now();
  const thresholdMs = reminderMinutes*60000;
  let anyOverdue = false;
  openMap.forEach(o=>{
    if(o.status !== 'new') return; // only orders nobody has picked up yet
    const age = now - ts(o.createdAt).getTime();
    if(age < thresholdMs) return;
    anyOverdue = true;
    const last = remindedAt.get(o.id) || 0;
    if(now - last >= thresholdMs){
      remindedAt.set(o.id, now);
      playReminderSound();
      showToast(`⏰ Нарачка #${o.orderNumber} чека веќе повеќе од ${reminderMinutes} мин!`);
    }
  });
  if(anyOverdue && activeTab==='queue') render();
}
setInterval(checkOverdueOrders, 15000);

loginBtn.addEventListener('click', async ()=>{
  loginErr.textContent = '';
  loginBtn.disabled = true;
  primeAudio();
  try{
    await auth.signInWithEmailAndPassword(emailInp.value.trim(), passInp.value);
  }catch(err){
    loginErr.textContent = 'Погрешна е-пошта или лозинка.';
  }finally{
    loginBtn.disabled = false;
  }
});
[emailInp, passInp].forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter') loginBtn.click(); }));

document.getElementById('logoutBtn').addEventListener('click', ()=> auth.signOut());

let unsubOpen=null;

auth.onAuthStateChanged(async user=>{
  if(unsubOpen){ unsubOpen(); unsubOpen=null; }

  if(!user){
    loginScreen.style.display='flex'; appScreen.style.display='none';
    return;
  }
  try{
    const [staffDoc, roleDoc] = await Promise.all([
      db.collection('staff').doc(user.uid).get(),
      db.collection('roles').doc(user.uid).get()
    ]);
    const role = roleDoc.exists ? roleDoc.data().role : null;
    if(role !== 'waiter' && role !== 'admin'){
      loginErr.textContent = 'Оваа сметка нема пристап до келнерскиот панел.';
      await auth.signOut();
      return;
    }
    myUid = user.uid;
    myRole = role;
    myName = staffDoc.exists ? staffDoc.data().name : (user.email || 'Келнер');
    document.getElementById('hiSub').textContent = myName;
    loginScreen.style.display='none'; appScreen.style.display='block';
    startListeners();
  }catch(err){
    console.error(err);
    loginErr.textContent = 'Грешка при најава. Обиди се повторно.';
    await auth.signOut();
  }
});

function startListeners(){
  firstOpenSnapshot = true;
  unsubOpen = db.collection('orders')
    .where('status','in', ['new','in_progress'])
    .onSnapshot(snap=>{
      if(!firstOpenSnapshot){
        snap.docChanges().forEach(change=>{
          if(change.type==='added'){
            notifyNewOrder({ id: change.doc.id, ...change.doc.data() });
          }
        });
      }
      firstOpenSnapshot = false;
      openMap = new Map(snap.docs.map(d=>[d.id, {id:d.id, ...d.data()}]));
      render();
    }, err=> console.error('open orders listener', err));

  db.collection('orders').where('status','==','completed').orderBy('completedAt','desc').limit(200)
    .onSnapshot(snap=>{
      billsOrders = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(activeTab==='bills') render();
    }, err=> console.error('bills listener', err));

  loadDoneToday();
}

async function loadDoneToday(){
  const start = new Date(); start.setHours(0,0,0,0);
  const snap = await db.collection('orders')
    .where('waiterId','==', myUid)
    .where('status','==','completed')
    .get();
  doneList = snap.docs
    .map(d=>({id:d.id, ...d.data()}))
    .filter(o=> o.completedAt && o.completedAt.toDate() >= start)
    .sort((a,b)=> b.completedAt.toDate() - a.completedAt.toDate());
  if(activeTab==='done') render();
}

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    activeTab = b.dataset.tab;
    document.querySelectorAll('nav.tabs button').forEach(x=> x.classList.toggle('active', x===b));
    if(activeTab==='done') loadDoneToday();
    if(activeTab==='schedule') listenSchedule();
    render();
  });
});

function ts(t){ return t && t.toDate ? t.toDate() : new Date(); }
function fmtTime(d){ return d.toLocaleTimeString('mk-MK', {hour:'2-digit',minute:'2-digit'}); }

function render(){
  const root = document.getElementById('mainRoot');
  root.innerHTML = '';

  if(activeTab==='queue'){
    const all = [...openMap.values()].sort((a,b)=> ts(a.createdAt) - ts(b.createdAt));
    if(all.length===0){
      root.innerHTML = '<div class="empty">Нема отворени нарачки.<br>Овде ќе се појават новите нарачки во живо.</div>';
      return;
    }
    all.forEach(o=> root.appendChild(renderCard(o)));
  } else if(activeTab==='done'){
    if(doneList.length===0){
      root.innerHTML = '<div class="empty">Сè уште немаш завршено нарачки денес.</div>';
      return;
    }
    doneList.forEach(o=> root.appendChild(renderCard(o, true)));
  } else if(activeTab==='schedule'){
    renderScheduleTab(root);
  } else if(activeTab==='bills'){
    renderBillsTab(root);
  }
}

function renderCard(o, done=false){
  const card = document.createElement('div');
  const isOverdue = !done && o.status==='new' && (Date.now() - ts(o.createdAt).getTime()) >= reminderMinutes*60000;
  card.className = 'order-card' + (isOverdue ? ' overdue' : '');
  const isMine = o.waiterId === myUid;
  const badge = done ? '' : (isOverdue ? '<span class="badge overdue">⏰ Доцни</span>' : (o.status==='in_progress' ? '<span class="badge progress">Во тек</span>' : '<span class="badge new">Нова</span>'));
  card.innerHTML = `
    <div class="oc-head"><span class="oc-num">#${o.orderNumber}</span>${badge}</div>
    <div class="oc-meta">
      <span>${o.type==='table' ? 'Маса ' + (o.table||'—') : 'За понесување'}</span>
      <span>${fmtTime(ts(o.createdAt))}</span>
      ${o.waiterName ? `<span>${isMine ? 'Кај тебе' : 'Кај ' + o.waiterName}</span>` : (done ? '' : '<span>Нема келнер</span>')}
    </div>
    <div class="oc-items">
      ${o.items.map(i=>`<div class="it"><span>${i.qty}× ${i.name}${i.vol?' ('+i.vol+')':''}</span><span>${i.price*i.qty} ден</span></div>`).join('')}
    </div>
    ${o.note ? `<div class="oc-note">${o.note}</div>` : ''}
    <div class="oc-total"><span>Вкупно</span><span>${o.total} ден</span></div>
    <div class="oc-actions"></div>
  `;
  const actions = card.querySelector('.oc-actions');

  const printBtn = document.createElement('button');
  printBtn.className = 'btn-print';
  printBtn.textContent = '🖨';
  printBtn.title = 'Печати';
  printBtn.addEventListener('click', ()=> printOrder(o));
  actions.appendChild(printBtn);

  if(!done){
    if(!isMine){
      const claimBtn = document.createElement('button');
      claimBtn.className = 'btn-claim';
      claimBtn.textContent = o.waiterId ? 'Преземи за себе' : 'Преземи';
      claimBtn.addEventListener('click', ()=> claimOrder(o));
      actions.appendChild(claimBtn);
    } else {
      const completeBtn = document.createElement('button');
      completeBtn.className = 'btn-complete';
      completeBtn.textContent = 'Заврши нарачка';
      completeBtn.addEventListener('click', ()=> completeOrder(o));
      actions.appendChild(completeBtn);
    }
  }
  return card;
}

async function claimOrder(o){
  try{
    await db.collection('orders').doc(o.id).update({
      waiterId: myUid, waiterName: myName, status: 'in_progress'
    });
  }catch(err){ console.error(err); alert('Не успеа да се преземе нарачката.'); }
}

async function completeOrder(o){
  try{
    await db.collection('orders').doc(o.id).update({
      status:'completed', waiterId: myUid, waiterName: myName,
      completedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    deductInventoryForOrder(o).catch(err=> console.error('inventory deduction failed', err));
    loadDoneToday();
  }catch(err){ console.error(err); alert('Не успеа да се заврши нарачката.'); }
}

async function deductInventoryForOrder(order){
  for(const item of order.items){
    const snap = await db.collection('inventory').where('linkedMenuId','==', item.id).get();
    for(const doc of snap.docs){
      const inv = doc.data();
      const used = (inv.usagePerOrder || 1) * item.qty;
      await db.runTransaction(async tx=>{
        const fresh = await tx.get(doc.ref);
        const newQty = (fresh.data().qty || 0) - used;
        tx.update(doc.ref, { qty:newQty });
      });
      await db.collection('procurements').add({
        inventoryId: doc.id, inventoryName: inv.name, delta: -used, type:'sale',
        orderId: order.id, orderNumber: order.orderNumber,
        note: `Продажба — нарачка #${order.orderNumber}`,
        createdBy: myName, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }
}

function printOrder(o){
  const el = document.getElementById('printReceipt');
  const time = fmtTime(ts(o.createdAt));
  const itemsHtml = o.items.map(i=>`<div class="r-line"><span>${i.qty}× ${i.name}${i.vol?' ('+i.vol+')':''}</span><span>${i.price*i.qty} ден</span></div>`).join('');
  const slip = (label)=> `
    <div class="slip">
      <h3>radost — ${label}</h3>
      <div class="r-line"><span>Нарачка</span><b>#${o.orderNumber}</b></div>
      <div class="r-line"><span>${o.type==='table' ? 'Маса' : 'Понеси'}</span><span>${o.type==='table' ? (o.table||'—') : ''}</span></div>
      <div class="r-line"><span>Келнер</span><span>${o.waiterName||myName}</span></div>
      <div class="r-line"><span>Време</span><span>${time}</span></div>
      <hr>${itemsHtml}<hr>
      <div class="r-line"><b>Вкупно</b><b>${o.total} ден</b></div>
      ${o.note ? `<div class="r-line"><span>Забелешка</span><span>${o.note}</span></div>` : ''}
    </div>`;
  el.innerHTML = slip('примерок за клиент') + slip('примерок за келнер');
  window.print();
}

/* ---------------- SCHEDULE (read-only) ---------------- */
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LABELS = ['Понеделник','Вторник','Среда','Четврток','Петок','Сабота','Недела'];

function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function fmtShortDate(d){ return d.toLocaleDateString('mk-MK', {day:'2-digit', month:'2-digit'}); }

let scheduleWeekStart = mondayOf(new Date());
let scheduleData = { shifts:{} };
let scheduleUnsub = null;

function listenSchedule(){
  if(scheduleUnsub) scheduleUnsub();
  const id = localDateStr(scheduleWeekStart);
  scheduleUnsub = db.collection('schedule').doc(id).onSnapshot(doc=>{
    scheduleData = doc.exists ? doc.data() : { shifts:{} };
    if(activeTab==='schedule') render();
  }, err=> console.error('schedule listener', err));
}

function renderScheduleTab(root){
  const nav = document.createElement('div');
  nav.className = 'filter-row';
  nav.innerHTML = `
    <button class="btn-week" data-nav="prev">‹ Претходна</button>
    <div style="align-self:center; font-weight:800; font-size:13px; flex:1; text-align:center;">
      ${fmtShortDate(scheduleWeekStart)} — ${fmtShortDate(new Date(scheduleWeekStart.getTime()+6*86400000))}
    </div>
    <button class="btn-week" data-nav="next">Следна ›</button>
  `;
  nav.querySelector('[data-nav="prev"]').addEventListener('click', ()=>{
    scheduleWeekStart = new Date(scheduleWeekStart.getTime() - 7*86400000);
    listenSchedule(); render();
  });
  nav.querySelector('[data-nav="next"]').addEventListener('click', ()=>{
    scheduleWeekStart = new Date(scheduleWeekStart.getTime() + 7*86400000);
    listenSchedule(); render();
  });
  root.appendChild(nav);

  DAY_KEYS.forEach((key, i)=>{
    const dayDate = new Date(scheduleWeekStart.getTime() + i*86400000);
    const shifts = (scheduleData.shifts && scheduleData.shifts[key]) || [];
    const card = document.createElement('div');
    card.className = 'order-card';
    const isToday = localDateStr(dayDate) === localDateStr(new Date());
    card.innerHTML = `
      <div class="oc-head"><span class="oc-num" style="font-size:14px;">${DAY_LABELS[i]} · ${fmtShortDate(dayDate)}</span>${isToday ? '<span class="badge progress">Денес</span>' : ''}</div>
      <div class="oc-items" style="border-bottom:none;">
        ${shifts.length ? shifts.map(sh=>`<div class="it"><span>${sh.waiterName===myName ? '<b>'+sh.waiterName+'</b> (ти)' : sh.waiterName}</span><span>${sh.start}–${sh.end}</span></div>`).join('') : '<div style="color:var(--gray); font-size:12.5px;">Нема закажани смени.</div>'}
      </div>
    `;
    root.appendChild(card);
  });
}

/* ---------------- BILLS (paid / open, grouped by table) ---------------- */
let showPaidBills = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function togglePaid(orderId, makePaid){
  try{ await db.collection('orders').doc(orderId).update({ paid: makePaid }); }
  catch(err){ console.error(err); alert('Грешка при промена на статусот на плаќање.'); }
}

function billGroupCard(title, orders){
  const unpaidOrders = orders.filter(o=> !o.paid);
  const allPaid = unpaidOrders.length===0;
  const sum = orders.reduce((s,o)=> s+o.total, 0);
  const unpaidSum = unpaidOrders.reduce((s,o)=> s+o.total, 0);

  const card = document.createElement('div');
  card.className = 'bill-group';
  card.innerHTML = `
    <div class="bill-head">
      <span class="t">${esc(title)}</span>
      <span class="badge ${allPaid ? 'paid' : 'unpaid'}">${allPaid ? 'Платено' : 'Отворено'}</span>
    </div>
    ${orders.map(o=> `
      <div class="bill-line">
        <span>#${o.orderNumber} · ${o.items.reduce((s,i)=>s+i.qty,0)} ставки${o.waiterName ? ' · '+esc(o.waiterName) : ''}</span>
        <span>${o.total} ден</span>
      </div>
    `).join('')}
    <div class="bill-total"><span>Вкупно${!allPaid ? ' (неплатено: '+unpaidSum+' ден)' : ''}</span><span>${sum} ден</span></div>
  `;
  const btn = document.createElement('button');
  btn.className = 'pay-btn ' + (allPaid ? 'mark-open' : 'mark-paid');
  btn.textContent = allPaid ? 'Означи како отворено' : 'Означи како платено';
  btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    if(allPaid){
      await Promise.all(orders.map(o=> togglePaid(o.id, false)));
    } else {
      await Promise.all(unpaidOrders.map(o=> togglePaid(o.id, true)));
    }
    btn.disabled = false;
  });
  card.appendChild(btn);
  return card;
}

function renderBillsTab(root){
  const toggle = document.createElement('div');
  toggle.className = 'filter-row';
  toggle.innerHTML = `<button class="btn-week" id="billsShowPaidBtn">${showPaidBills ? '✓ Прикажани и платените' : 'Прикажи ги и платените'}</button>`;
  toggle.querySelector('button').addEventListener('click', ()=>{ showPaidBills = !showPaidBills; render(); });
  root.appendChild(toggle);

  const tableGroups = new Map();
  const noTable = [];
  billsOrders.forEach(o=>{
    if(o.type==='table' && o.table){
      if(!tableGroups.has(o.table)) tableGroups.set(o.table, []);
      tableGroups.get(o.table).push(o);
    } else {
      noTable.push(o);
    }
  });

  let rendered = 0;
  const sortedTables = [...tableGroups.keys()].sort((a,b)=> (parseInt(a)||0)-(parseInt(b)||0) || String(a).localeCompare(String(b)));
  sortedTables.forEach(tableNum=>{
    const orders = tableGroups.get(tableNum);
    const hasUnpaid = orders.some(o=> !o.paid);
    if(!showPaidBills && !hasUnpaid) return;
    root.appendChild(billGroupCard('Маса ' + tableNum, orders));
    rendered++;
  });

  noTable.forEach(o=>{
    if(!showPaidBills && o.paid) return;
    root.appendChild(billGroupCard('Без маса · #'+o.orderNumber, [o]));
    rendered++;
  });

  if(rendered===0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = showPaidBills ? 'Нема завршени нарачки.' : 'Нема отворени сметки.';
    root.appendChild(empty);
  }
}
